name: Reviewer B - Synthetic Authenticated Receiver PostgreSQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'sql/reviewer_b_shadow_authenticated_receiver_v1.sql'
      - 'test/openrouter-shadow-authenticated-receiver-postgres-real.test.mjs'
      - '.github/workflows/reviewer-b-shadow-authenticated-receiver.yml'

permissions:
  contents: read

jobs:
  synthetic-receiver:
    name: PostgreSQL16 session identity and role-spoof denial (NO SPEND)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: synthetic-shadow-ci-only-20261020
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
    steps:
      - name: Fetch exact same-repository PR SHA (read only)
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_SHA: ${{ github.event.pull_request.head.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = "devfactory-reviewer-trust/devfactory-reviewer-b-publisher"
          test "$GH_HEAD_REPO" = "$GH_REPO"
          [[ "$GH_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir source
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer ${GH_READ_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPO}/tarball/${GH_SHA}" \
            --output source.tar.gz
          unset GH_READ_TOKEN
          tar -xzf source.tar.gz -C source --strip-components=1
      - name: Install isolated PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/shadow-receiver-client" \
            --no-save --ignore-scripts --no-audit --no-fund --silent pg@8.13.3
          test -f "$RUNNER_TEMP/shadow-receiver-client/node_modules/pg/lib/index.js"
      - name: Verify true SESSION_USER, NOLOGIN default and rollback
        shell: bash
        env:
          SHADOW_POSTGRES_REAL: '1'
          SHADOW_PG_CLIENT_ENTRY: ${{ runner.temp }}/shadow-receiver-client/node_modules/pg/lib/index.js
          PGHOST: 127.0.0.1
          PGPASSWORD: synthetic-shadow-ci-only-20261020
        run: |
          set -euo pipefail
          cd source
          node --test test/openrouter-shadow-authenticated-receiver-postgres-real.test.mjs
