name: Reviewer B - Free Ollama Synthetic Canary

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main]
    paths:
      - '.github/workflows/reviewer-b-ollama-synthetic-canary.yml'
      - 'bench/**'
      - 'candidate/ollama-offline-contract.mjs'
      - 'test/ollama-synthetic-benchmark.test.mjs'
      - 'test/ollama-offline-contract.test.mjs'

permissions:
  contents: read

jobs:
  synthetic-local-ollama:
    if: github.repository == 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher' && github.event.pull_request.head.repo.full_name == github.repository && (contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark') || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen3') || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-7b') || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35') || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35-9b') || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35-9b-holdout'))
    name: Synthetic Ollama ${{ matrix.model }} - NO secrets or private code
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Third-model-only opt-in avoids rerunning already-failed 7B/14B.
        include: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-7b') && '[{"model":"qwen2.5-coder:7b","cli_arg":""}]' || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen3') && '[{"model":"qwen3:8b","cli_arg":"--qwen3-synthetic"}]' || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35') && '[{"model":"qwen3.5:4b","cli_arg":"--qwen35-synthetic"}]' || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35-9b') && '[{"model":"qwen3.5:9b","cli_arg":"--qwen35-9b-synthetic"}]' || contains(github.event.pull_request.labels.*.name, 'reviewer-b-benchmark-qwen35-9b-holdout') && '[{"model":"qwen3.5:9b","cli_arg":"--qwen35-9b-holdout"}]' || '[{"model":"qwen2.5-coder:7b","cli_arg":""},{"model":"qwen2.5-coder:14b","cli_arg":"--large-synthetic"},{"model":"qwen3:8b","cli_arg":"--qwen3-synthetic"}]') }}
    steps:
      - name: Checkout exact PUBLIC PR HEAD without third-party actions
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_SHA: ${{ github.event.pull_request.head.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = "devfactory-reviewer-trust/devfactory-reviewer-b-publisher"
          test "$GH_HEAD_REPO" = "$GH_REPO"
          [[ "$GH_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir source
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer ${GH_READ_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GH_REPO}/tarball/${GH_SHA}" \
            --output source.tar.gz
          unset GH_READ_TOKEN
          tar -xzf source.tar.gz -C source --strip-components=1
      - name: Install exact checksum-pinned upstream Ollama binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst" \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          test -x "$RUNNER_TEMP/ollama/bin/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Run offline-model canary on synthetic cases ONLY
        shell: bash
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          BENCHMARK_MODEL: ${{ matrix.model }}
          BENCHMARK_ARG: ${{ matrix.cli_arg }}
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama-service.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --noproxy '*' \
              "http://127.0.0.1:11434/api/tags" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --noproxy '*' \
            "http://127.0.0.1:11434/api/tags" > /dev/null
          case "$BENCHMARK_MODEL" in
            'qwen2.5-coder:7b'|'qwen2.5-coder:14b'|'qwen3:8b'|'qwen3.5:4b'|'qwen3.5:9b') ;;
            *) exit 1 ;;
          esac
          ollama pull "$BENCHMARK_MODEL" > /dev/null
          cd source
          if [[ "$BENCHMARK_ARG" == '--large-synthetic' ]]; then
            node bench/ollama-synthetic-benchmark.mjs --large-synthetic | tee "$RUNNER_TEMP/synthetic-report.json"
          elif [[ "$BENCHMARK_ARG" == '--qwen3-synthetic' ]]; then
            node bench/ollama-synthetic-benchmark.mjs --qwen3-synthetic | tee "$RUNNER_TEMP/synthetic-report.json"
          elif [[ "$BENCHMARK_ARG" == '--qwen35-synthetic' ]]; then
            node bench/ollama-synthetic-benchmark.mjs --qwen35-synthetic | tee "$RUNNER_TEMP/synthetic-report.json"
          elif [[ "$BENCHMARK_ARG" == '--qwen35-9b-synthetic' ]]; then
            node bench/ollama-synthetic-benchmark.mjs --qwen35-9b-synthetic | tee "$RUNNER_TEMP/synthetic-report.json"
          elif [[ "$BENCHMARK_ARG" == '--qwen35-9b-holdout' ]]; then
            node bench/ollama-synthetic-benchmark.mjs --qwen35-9b-holdout | tee "$RUNNER_TEMP/synthetic-report.json"
          else
            test -z "$BENCHMARK_ARG"
            node bench/ollama-synthetic-benchmark.mjs | tee "$RUNNER_TEMP/synthetic-report.json"
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r=JSON.parse(readFileSync(process.argv[1],"utf8"));
            const holdout=process.argv[3]==="--qwen35-9b-holdout";
            if((holdout && r.fixtureSet!=="holdout") ||
               (!holdout && r.fixtureSet!==undefined))
              throw Error("SYNTHETIC_FIXTURE_SET_MISMATCH");
            if(r.syntheticQualityGatePassed===false)
              throw Error("MODEL_QUALITY_GATE_FAILED_NOT_PRODUCTION_READY");
            if(r.benchmark!=="synthetic-local-ollama-v2" ||
              r.model!==process.argv[2] || r.testsCompleted!==12 ||
              r.seededSemanticBugs!==5 || r.cleanFixtures!==5 ||
              !Number.isSafeInteger(r.cleanFixtureBlockingFalseAlerts) ||
              !Array.isArray(r.qualityGate?.blockers) ||
              r.syntheticQualityGatePassed!==true ||
              r.approvalAuthorized!==false ||
              r.independentReviewerProvenanceVerified!==false ||
              r.privateSourceReviewed!==false ||
              !Array.isArray(r.cases) || r.cases.length!==12)process.exit(1);
            process.stdout.write("SYNTHETIC_MODEL_EXECUTION_VERIFIED_NOT_INDEPENDENT_REVIEW\n");
            if(!r.syntheticQualityGatePassed)
              throw Error("MODEL_QUALITY_GATE_FAILED_NOT_PRODUCTION_READY");
          ' "$RUNNER_TEMP/synthetic-report.json" "$BENCHMARK_MODEL" "$BENCHMARK_ARG"
