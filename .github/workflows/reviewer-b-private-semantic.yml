name: Reviewer B - protected PRIVATE local semantic review

# Protected-main execution ONLY. Service-owned issue #21 request or a
# reviewed marker/dispatch, each subject to separate environment approval.
# No PR-triggered execution, untrusted PR code checkout, elevated token, or retry.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact private DevFactory PR to analyze (non-draft)'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - docs/reviewer-b-semantic-live-899-20261011.marker
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: reviewer-b-protected-real-semantic-manual
  cancel-in-progress: false

jobs:
  protected-private-local-semantic:
    name: Real Qwen PRIVATE analysis - native COMMENT only
    # OWNER POLICY 2026-10-24: local Ollama/Qwen reviews are retired.
    # Review exclusively via protected reviewer-b-private-openrouter.yml.
    # If cloud budget/ZDR are not attested, SKIP (never fall back to local).
    # Hard false ensures existing dispatch/comment/push triggers consume no runner.
    if: ${{ false }}
    environment: reviewer-b-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Get exact protected PUBLIC source (no PR checkout)
        shell: bash
        env:
          PUB_REPO: ${{ github.repository }}
          PUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PUB_REPO" = "devfactory-reviewer-trust/devfactory-reviewer-b-publisher"
          [[ "$PUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir source
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' \
            --max-time 45 --max-filesize 8388608 \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PUB_REPO}/tarball/${PUB_SHA}" \
            --output "$RUNNER_TEMP/publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/publisher.tar.gz" -C source --strip-components=1
          test -f source/scripts/protected-real-semantic-review.mjs
          test -f source/scripts/protected-review-request.mjs
      - name: Authenticate one review request BEFORE PRIVATE credentials
        id: review_request
        shell: bash
        env:
          REVIEWER_B_DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          node source/scripts/protected-review-request.mjs
      - name: Install checksum-pinned Ollama BEFORE loading PRIVATE credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' --max-time 300 \
            "https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst" \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          test -x "$RUNNER_TEMP/ollama/bin/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start isolated local model before PRIVATE read
        shell: bash
        env:
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          # Bound CPU-hosted model memory without changing Qwen or authority.
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_FLASH_ATTENTION: '1'
          OLLAMA_KV_CACHE_TYPE: 'q8_0'
          MODEL: 'qwen2.5-coder:7b'
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama-service.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --noproxy '*' \
              "http://127.0.0.1:11434/api/tags" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --noproxy '*' \
            "http://127.0.0.1:11434/api/tags" > /dev/null
          test "$MODEL" = 'qwen2.5-coder:7b'
          ollama pull "$MODEL" > /dev/null
      - name: Immutable PRIVATE diff -> local semantic findings -> native COMMENTED
        shell: bash
        env:
          REVIEWER_B_GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.REVIEWER_B_GITHUB_APP_PRIVATE_KEY_PEM }}
          REVIEWER_B_TARGET_PR: ${{ steps.review_request.outputs.pr_number }}
          REVIEWER_B_EXPECTED_HEAD: ${{ steps.review_request.outputs.expected_head }}
          REVIEWER_B_EXPECTED_MODEL: 'qwen2.5-coder:7b'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
        run: |
          set -euo pipefail
          cd source
          node scripts/protected-real-semantic-review.mjs
      - name: Sanitized local model failure diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          # No Ollama stderr, API bodies, prompts, diffs, filenames or
          # credentials in public workflow logs; only bounded system state.
          set -euo pipefail
          if curl --fail --silent --max-time 3 --noproxy '*'             'http://127.0.0.1:11434/api/tags' > /dev/null 2>&1; then
            echo 'OLLAMA_LOOPBACK_REACHABLE'
          else
            echo 'OLLAMA_LOOPBACK_UNREACHABLE'
          fi
          if pgrep -x ollama > /dev/null 2>&1; then
            echo 'OLLAMA_PROCESS_PRESENT'
          else
            echo 'OLLAMA_PROCESS_ABSENT'
          fi
          if test -r /proc/meminfo; then
            awk '/^(MemTotal:|MemAvailable:|SwapTotal:|SwapFree:)/ {
              print "RESOURCE_" $1 " " $2 " kB"
            }' /proc/meminfo
          fi
          if test -r /sys/fs/cgroup/memory.events; then
            awk '/^(oom|oom_kill|oom_group_kill) / {
              print "CGROUP_" $1 " " $2
            }' /sys/fs/cgroup/memory.events
          fi
